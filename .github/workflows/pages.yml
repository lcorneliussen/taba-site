name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: node --test scripts/release.test.mjs
      - run: node --test scripts/control-ui-source.test.mjs
      - run: npx playwright install --with-deps chromium
      - uses: actions/checkout@v7
        with:
          repository: openclaw/openclaw
          ref: b8952d477f0c932d8ddc6da5c89cab5a169b6ff1
          path: .host-source
          persist-credentials: false
          sparse-checkout: |
            ui/src/styles
            ui/src/app/typography.ts
            ui/src/plugins
            ui/public/fonts
      - run: node --test scripts/openclaw-host-source.test.mjs
        env:
          OPENCLAW_HOST_SOURCE: ${{ github.workspace }}/.host-source
      - run: npm run test:visual
      - run: npm run check
      - run: npm run test:status
      - run: npm run test:links:guards
      - run: npm run build
      - run: npm run test:links
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
